services:
  postgres:
    image: postgres:16
    container_name: registry-postgres
    environment:
      POSTGRES_USER: ${PG_USER:-mlflow}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-mlflow}
      POSTGRES_DB: ${PG_DB:-mlflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-mlflow} -d ${PG_DB:-mlflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: registry-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: creates the artifact bucket, then exits. Must wait for minio to be
  # healthy or `mc mb` races the server startup and fails.
  minio-setup:
    image: minio/mc:latest
    container_name: registry-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
      MLFLOW_BUCKET: ${MLFLOW_BUCKET:-mlflow-artifacts}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASSWORD} &&
      mc mb -p local/$${MLFLOW_BUCKET} &&
      echo 'bucket ready: '$${MLFLOW_BUCKET}
      "

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    container_name: registry-mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:-minioadmin}
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${PG_USER:-mlflow}:${PG_PASSWORD:-mlflow}@postgres:5432/${PG_DB:-mlflow}
      --artifacts-destination s3://${MLFLOW_BUCKET:-mlflow-artifacts}
      --serve-artifacts
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
