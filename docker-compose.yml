services:
  postgres:
    image: postgres:16
    container_name: registry-postgres
    environment:
      POSTGRES_USER: ${PG_USER:-mlflow}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-mlflow}
      POSTGRES_DB: ${PG_DB:-mlflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-mlflow} -d ${PG_DB:-mlflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Artifacts (the weight files) live in a GCS bucket; only metadata is here.
  # --serve-artifacts makes the server proxy every upload/download, so clients
  # need nothing but MLFLOW_TRACKING_URI — no GCS credentials on consumers.
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    container_name: registry-mlflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      # On a GCE VM the attached service account is used automatically (ADC)
      # and this stays empty. Off-GCP, mount a key file or your gcloud ADC
      # into the container and point this at it — see README.
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    # volumes:
    #   - ${GOOGLE_APPLICATION_CREDENTIALS}:${GOOGLE_APPLICATION_CREDENTIALS}:ro
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${PG_USER:-mlflow}:${PG_PASSWORD:-mlflow}@postgres:5432/${PG_DB:-mlflow}
      --artifacts-destination gs://${GCS_BUCKET:?set GCS_BUCKET in .env — the bucket that holds model weights}
      --serve-artifacts
    ports:
      # MLflow has NO authentication. Never expose this port publicly —
      # firewall it or put an authenticating reverse proxy in front.
      - "${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
