name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Unit tests (sqlite backend, no services)
        run: pytest -q

      - name: Catalog parses under the strict loader
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "scripts")
          from pathlib import Path
          import register_from_hf as r
          specs = r.load_catalog(Path("models.yaml"))
          assert specs, "empty catalog"
          print(len(specs), "entries:", [s["name"] for s in specs])
          PY

      - name: Compose file validates
        env:
          GCS_BUCKET: ci-placeholder
          GOOGLE_CLOUD_PROJECT: ci
        run: docker compose config -q
